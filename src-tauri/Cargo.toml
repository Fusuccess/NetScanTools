[package]
name = "netscantools"
version = "0.1.0"
description = "LAN scanner, port scanner, and SSH local forwarding"
authors = ["you"]
edition = "2021"

[lib]
name = "netscantools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util"] }
tokio-util = "0.7"
if-addrs = "0.13"
ipnetwork = "0.21"
dns-lookup = "2"
        uuid = { version = "1", features = ["v4", "serde"] }
        russh = "0.54"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
